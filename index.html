<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Woop TV Player</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: white;
      background: black;
      font-family: Arial, sans-serif;
      font-size: 32px;
    }
  </style>
</head>

<body>

  <div id="player"></div>
  <div id="error">Bande-annonce indisponible</div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("v");

    let player;

    function onYouTubeIframeAPIReady() {

      if (!videoId) {
        document.getElementById("error").style.display = "flex";
        return;
      }

      player = new YT.Player("player", {

        width: "100%",
        height: "100%",

        videoId: videoId,

        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0,
          playsinline: 1,
          fs: 0,
          hl: "fr",
          cc_lang_pref: "fr",
          origin: "https://ghlami2.github.io"
        },

        events: {

          onReady: function(event) {
            event.target.playVideo();
          },

          onError: function(event) {
            document.getElementById("error").style.display = "flex";
          }

        }
      });
    }
  </script>

</body>
</html>
