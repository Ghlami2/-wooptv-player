<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Woop TV Player</title>

  <!-- Préconnexions pour accélérer YouTube -->
  <link rel="preconnect" href="https://www.youtube.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
  <link rel="preconnect" href="https://www.google.com" crossorigin>

  <link rel="dns-prefetch" href="//www.youtube.com">
  <link rel="dns-prefetch" href="//i.ytimg.com">
  <link rel="dns-prefetch" href="//googlevideo.com">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      position: fixed;
      left: 0;
      top: 0;

      margin: 0 !important;
      padding: 0 !important;

      width: 100% !important;
      height: 100% !important;

      min-width: 100% !important;
      min-height: 100% !important;

      overflow: hidden !important;
      background: #000 !important;
    }

    #player,
    #player iframe,
    iframe {
      position: fixed !important;

      left: 0 !important;
      top: 0 !important;

      margin: 0 !important;
      padding: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      min-width: 100vw !important;
      min-height: 100vh !important;

      max-width: none !important;
      max-height: none !important;

      border: 0 !important;
      background: #000 !important;
    }

    #error {
      display: none;

      position: fixed;
      inset: 0;

      align-items: center;
      justify-content: center;

      width: 100vw;
      height: 100vh;

      color: #fff;
      background: #000;

      font-family: Arial, sans-serif;
      font-size: 30px;
      text-align: center;

      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="player"></div>

  <div id="error">
    Bande-annonce indisponible
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>

    var params = new URLSearchParams(
      window.location.search
    );

    var videoId = params.get("v");

    var warmOnly =
      params.get("warm") === "1";

    var player = null;


    /* --------------------------------
       Communication avec Woop TV
    -------------------------------- */

    function notify(type) {

      try {

        window.parent.postMessage(
          {
            type: type
          },
          "*"
        );

      } catch (e) {}

    }


    /* --------------------------------
       Force le plein écran sur Tizen
    -------------------------------- */

    function forceFullscreenSize() {

      var host =
        document.getElementById("player");


      if (host) {

        host.style.position = "fixed";

        host.style.left = "0";
        host.style.top = "0";

        host.style.width = "100vw";
        host.style.height = "100vh";

      }


      var frame =
        document.querySelector("#player iframe") ||
        document.querySelector("iframe");


      if (frame) {

        frame.setAttribute(
          "width",
          "1920"
        );

        frame.setAttribute(
          "height",
          "1080"
        );


        frame.style.position =
          "fixed";

        frame.style.left =
          "0";

        frame.style.top =
          "0";


        frame.style.width =
          "100vw";

        frame.style.height =
          "100vh";


        frame.style.minWidth =
          "100vw";

        frame.style.minHeight =
          "100vh";


        frame.style.maxWidth =
          "none";

        frame.style.maxHeight =
          "none";


        frame.style.margin =
          "0";

        frame.style.padding =
          "0";

        frame.style.border =
          "0";

      }

    }


    /* --------------------------------
       API YouTube prête
    -------------------------------- */

    function onYouTubeIframeAPIReady() {


      /*
        MODE WARM-UP

        Woop appelle cette page discrètement
        dès l'ouverture d'une fiche film.

        GitHub + iframe_api + connexions
        YouTube sont donc déjà chargés.

        Aucune vidéo n'est lancée.
      */

      if (warmOnly) {

        notify(
          "wooptv-trailer-warmed"
        );

        return;

      }


      /*
        Aucun ID YouTube
      */

      if (!videoId) {

        document
          .getElementById("error")
          .style.display = "flex";


        notify(
          "wooptv-trailer-error"
        );

        return;

      }


      /* --------------------------------
         Création du player
      -------------------------------- */

      player =
        new YT.Player(
          "player",
          {

            width: 1920,

            height: 1080,

            videoId: videoId,


            playerVars: {

              /*
                Lecture automatique
              */

              autoplay: 1,


              /*
                Interface minimale
              */

              controls: 0,

              fs: 0,

              disablekb: 1,


              /*
                Sous-titres
                NON forcés
              */

              cc_load_policy: 0,


              /*
                Annotations désactivées
              */

              iv_load_policy: 3,


              /*
                Pas de suggestions
                classiques
              */

              rel: 0,


              /*
                Lecture dans notre
                player Woop
              */

              playsinline: 1,


              /*
                Interface FR
              */

              hl: "fr",


              /*
                Origine HTTPS
                nécessaire pour YouTube
              */

              origin:
                "https://ghlami2.github.io",


              widget_referrer:
                "https://ghlami2.github.io/-wooptv-player/"

            },


            events: {


              /* ------------------------
                 Player prêt
              ------------------------ */

              onReady:
                function(event) {


                  forceFullscreenSize();


                  setTimeout(
                    forceFullscreenSize,
                    100
                  );


                  setTimeout(
                    forceFullscreenSize,
                    500
                  );


                  setTimeout(
                    forceFullscreenSize,
                    1500
                  );


                  /*
                    Sécurité supplémentaire
                    contre les sous-titres
                    activés automatiquement.
                  */

                  try {

                    event.target
                      .unloadModule(
                        "captions"
                      );

                  } catch (e) {}


                  /*
                    Dit à Woop que
                    le player est prêt.
                  */

                  notify(
                    "wooptv-trailer-ready"
                  );


                  /*
                    Lecture immédiate
                  */

                  event.target
                    .playVideo();

                },


              /* ------------------------
                 État de lecture
              ------------------------ */

              onStateChange:
                function(event) {


                  forceFullscreenSize();


                  /*
                    La vidéo joue :
                    Woop retire le spinner.
                  */

                  if (
                    event.data ===
                    YT.PlayerState.PLAYING
                  ) {

                    notify(
                      "wooptv-trailer-playing"
                    );

                  }


                  /*
                    FIN DU TRAILER

                    Woop ferme le player
                    et revient automatiquement
                    sur la fiche du film.
                  */

                  if (
                    event.data ===
                    YT.PlayerState.ENDED
                  ) {

                    notify(
                      "wooptv-trailer-ended"
                    );

                  }

                },


              /* ------------------------
                 Erreur YouTube
              ------------------------ */

              onError:
                function() {


                  document
                    .getElementById("error")
                    .style.display =
                      "flex";


                  notify(
                    "wooptv-trailer-error"
                  );

                }

            }

          }
        );


      /*
        Sécurité Tizen :
        on réimpose plusieurs fois
        les dimensions plein écran.
      */

      setTimeout(
        forceFullscreenSize,
        250
      );


      setTimeout(
        forceFullscreenSize,
        1000
      );


      setTimeout(
        forceFullscreenSize,
        2500
      );

    }


    /* --------------------------------
       Changement de résolution TV
    -------------------------------- */

    window.addEventListener(
      "resize",
      forceFullscreenSize
    );

  </script>

</body>
</html>
