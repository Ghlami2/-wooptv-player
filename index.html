<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Woop TV Player</title>

  <!-- Préconnexion : réduit le délai avant le démarrage YouTube -->
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://googlevideo.com">
  <link rel="dns-prefetch" href="//www.youtube.com">
  <link rel="dns-prefetch" href="//i.ytimg.com">
  <link rel="dns-prefetch" href="//googlevideo.com">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      position: fixed;
      left: 0;
      top: 0;

      margin: 0 !important;
      padding: 0 !important;

      width: 100% !important;
      height: 100% !important;

      min-width: 100% !important;
      min-height: 100% !important;

      overflow: hidden !important;
      background: #000 !important;
    }

    #player,
    #player iframe,
    iframe {
      position: fixed !important;

      left: 0 !important;
      top: 0 !important;

      margin: 0 !important;
      padding: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      min-width: 100vw !important;
      min-height: 100vh !important;

      max-width: none !important;
      max-height: none !important;

      border: 0 !important;
      background: #000 !important;
    }

    #error {
      display: none;

      position: fixed;
      inset: 0;

      align-items: center;
      justify-content: center;

      width: 100vw;
      height: 100vh;

      color: #fff;
      background: #000;

      font-family: Arial, sans-serif;
      font-size: 30px;
      text-align: center;

      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="player"></div>

  <div id="error">
    Bande-annonce indisponible
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    var params = new URLSearchParams(window.location.search);

    var videoId = params.get("v");

    var player = null;


    function forceFullscreenSize() {

      var host = document.getElementById("player");

      if (host) {
        host.style.position = "fixed";
        host.style.left = "0";
        host.style.top = "0";
        host.style.width = "100vw";
        host.style.height = "100vh";
      }


      var frame =
        document.querySelector("#player iframe") ||
        document.querySelector("iframe");


      if (frame) {

        frame.setAttribute("width", "1920");
        frame.setAttribute("height", "1080");

        frame.style.position = "fixed";

        frame.style.left = "0";
        frame.style.top = "0";

        frame.style.width = "100vw";
        frame.style.height = "100vh";

        frame.style.minWidth = "100vw";
        frame.style.minHeight = "100vh";

        frame.style.maxWidth = "none";
        frame.style.maxHeight = "none";

        frame.style.margin = "0";
        frame.style.padding = "0";
        frame.style.border = "0";
      }
    }


    function notifyTrailerEnded() {

      try {

        window.parent.postMessage(
          {
            type: "wooptv-trailer-ended"
          },
          "*"
        );

      } catch (e) {}
    }


    function onYouTubeIframeAPIReady() {

      if (!videoId) {

        document.getElementById("error").style.display = "flex";

        return;
      }


      player = new YT.Player("player", {

        width: 1920,
        height: 1080,

        videoId: videoId,


        playerVars: {

          autoplay: 1,

          /* Interface minimale */
          controls: 0,
          fs: 0,
          disablekb: 1,

          /* Sous-titres désactivés par défaut */
          cc_load_policy: 0,

          /* Supprime les annotations */
          iv_load_policy: 3,

          rel: 0,
          playsinline: 1,

          hl: "fr",

          origin: "https://ghlami2.github.io",

          widget_referrer:
            "https://ghlami2.github.io/-wooptv-player/"
        },


        events: {

          onReady: function(event) {

            forceFullscreenSize();

            setTimeout(forceFullscreenSize, 100);
            setTimeout(forceFullscreenSize, 500);
            setTimeout(forceFullscreenSize, 1500);

            /*
              Sécurité supplémentaire :
              si YouTube recharge malgré tout le module captions,
              on essaie de le retirer.
            */
            try {
              event.target.unloadModule("captions");
            } catch (e) {}

            event.target.playVideo();
          },


          onStateChange: function(event) {

            forceFullscreenSize();

            /*
              Trailer terminé :
              on prévient Woop TV qui ferme l'overlay
              et revient sur la fiche du film.
            */
            if (event.data === YT.PlayerState.ENDED) {
              notifyTrailerEnded();
            }
          },


          onError: function() {
            document.getElementById("error").style.display = "flex";
          }
        }
      });


      setTimeout(forceFullscreenSize, 250);
      setTimeout(forceFullscreenSize, 1000);
      setTimeout(forceFullscreenSize, 2500);
    }


    window.addEventListener(
      "resize",
      forceFullscreenSize
    );
  </script>

</body>
</html>
