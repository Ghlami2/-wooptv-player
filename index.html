<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Woop TV Player</title>

<link rel="preconnect" href="https://www.youtube.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://www.google.com" crossorigin>

<link rel="dns-prefetch" href="//www.youtube.com">
<link rel="dns-prefetch" href="//i.ytimg.com">
<link rel="dns-prefetch" href="//googlevideo.com">

<style>

* {
  box-sizing: border-box;
}

html,
body {
  position: fixed;
  left: 0;
  top: 0;

  margin: 0 !important;
  padding: 0 !important;

  width: 100% !important;
  height: 100% !important;

  overflow: hidden !important;

  background: #000 !important;
}

#player,
#player iframe,
iframe {
  position: fixed !important;

  left: 0 !important;
  top: 0 !important;

  margin: 0 !important;
  padding: 0 !important;

  width: 100vw !important;
  height: 100vh !important;

  min-width: 100vw !important;
  min-height: 100vh !important;

  max-width: none !important;
  max-height: none !important;

  border: 0 !important;

  background: #000 !important;
}

#error {
  display: none;

  position: fixed;
  inset: 0;

  align-items: center;
  justify-content: center;

  width: 100vw;
  height: 100vh;

  color: #fff;
  background: #000;

  font-family: Arial, sans-serif;
  font-size: 30px;

  text-align: center;

  z-index: 10;
}

</style>
</head>

<body>

<div id="player"></div>

<div id="error">
  Bande-annonce indisponible
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

var params =
  new URLSearchParams(
    window.location.search
  );

var videoId =
  params.get("v");

var warmOnly =
  params.get("warm") === "1";

var player = null;


/* =====================================================
   COMMUNICATION AVEC WOOP TV
===================================================== */

function notify(type) {

  try {

    window.parent.postMessage(
      {
        type: type
      },
      "*"
    );

  } catch (e) {}

}


/* =====================================================
   FORCE LE PLAYER EN PLEIN ÉCRAN
===================================================== */

function forceFullscreenSize() {

  var host =
    document.getElementById(
      "player"
    );


  if (host) {

    host.style.position =
      "fixed";

    host.style.left =
      "0";

    host.style.top =
      "0";

    host.style.width =
      "100vw";

    host.style.height =
      "100vh";

  }


  var frame =
    document.querySelector(
      "#player iframe"
    ) ||
    document.querySelector(
      "iframe"
    );


  if (frame) {

    frame.setAttribute(
      "width",
      "1920"
    );

    frame.setAttribute(
      "height",
      "1080"
    );


    frame.style.position =
      "fixed";

    frame.style.left =
      "0";

    frame.style.top =
      "0";


    frame.style.width =
      "100vw";

    frame.style.height =
      "100vh";


    frame.style.minWidth =
      "100vw";

    frame.style.minHeight =
      "100vh";


    frame.style.maxWidth =
      "none";

    frame.style.maxHeight =
      "none";


    frame.style.margin =
      "0";

    frame.style.padding =
      "0";

    frame.style.border =
      "0";

  }

}


/* =====================================================
   DÉSACTIVATION FORCÉE DES SOUS-TITRES
===================================================== */

function forceCaptionsOff(target) {

  if (!target) {
    return;
  }


  /*
    On ne se contente pas de :

    cc_load_policy: 0

    car YouTube peut restaurer une préférence
    de sous-titres enregistrée précédemment.

    On force donc leur désactivation
    directement après initialisation.
  */


  try {

    target.setOption(
      "captions",
      "track",
      {}
    );

  } catch (e) {}


  try {

    target.setOption(
      "captions",
      "reload",
      true
    );

  } catch (e) {}


  try {

    target.unloadModule(
      "captions"
    );

  } catch (e) {}

}


/* =====================================================
   API YOUTUBE PRÊTE
===================================================== */

function onYouTubeIframeAPIReady() {


  /* -------------------------------------------------
     MODE WARM-UP

     Woop TV peut charger cette page discrètement
     pendant que l'utilisateur consulte la fiche.

     Cela initialise déjà :
     - GitHub Pages
     - iframe_api
     - connexion YouTube
     - DNS Google/GoogleVideo

     Mais aucune vidéo n'est lancée.
  ------------------------------------------------- */

  if (warmOnly) {

    notify(
      "wooptv-trailer-warmed"
    );

    return;

  }


  /* -------------------------------------------------
     PAS D'ID YOUTUBE
  ------------------------------------------------- */

  if (!videoId) {

    document
      .getElementById("error")
      .style.display =
        "flex";


    notify(
      "wooptv-trailer-error"
    );

    return;

  }


  /* =================================================
     CRÉATION DU PLAYER YOUTUBE
  ================================================= */

  player =
    new YT.Player(
      "player",
      {

        width: 1920,

        height: 1080,

        videoId: videoId,


        playerVars: {

          /* Lecture automatique */

          autoplay: 1,


          /* Interface minimale */

          controls: 0,

          fs: 0,

          disablekb: 1,


          /*
            Ne jamais demander explicitement
            les sous-titres.
          */

          cc_load_policy: 0,


          /* Pas d'annotations */

          iv_load_policy: 3,


          /* Suggestions limitées */

          rel: 0,


          /*
            Lecture directement
            dans le player Woop TV.
          */

          playsinline: 1,


          /* Interface française */

          hl: "fr",


          /*
            Origine HTTPS GitHub Pages
            utilisée par le player.
          */

          origin:
            "https://ghlami2.github.io",


          widget_referrer:
            "https://ghlami2.github.io/-wooptv-player/"

        },


        events: {


          /* =========================================
             PLAYER YOUTUBE PRÊT
          ========================================= */

          onReady:
            function(event) {


              forceFullscreenSize();


              /*
                PREMIÈRE désactivation
                des sous-titres.
              */

              forceCaptionsOff(
                event.target
              );


              /*
                On recommence après quelques
                millisecondes car le module captions
                peut être chargé APRÈS onReady
                sur certaines versions de Tizen.
              */

              setTimeout(
                function() {

                  forceCaptionsOff(
                    event.target
                  );

                },
                150
              );


              setTimeout(
                function() {

                  forceCaptionsOff(
                    event.target
                  );

                },
                700
              );


              /*
                Sécurité plein écran Tizen.
              */

              setTimeout(
                forceFullscreenSize,
                100
              );


              setTimeout(
                forceFullscreenSize,
                500
              );


              setTimeout(
                forceFullscreenSize,
                1500
              );


              /*
                IMPORTANT :

                READY ne signifie PAS encore
                que la vidéo est visible.

                Woop TV garde donc son écran
                noir + spinner à ce moment-là.
              */

              notify(
                "wooptv-trailer-ready"
              );


              /*
                Lancement du trailer.
              */

              event.target
                .playVideo();

            },


          /* =========================================
             CHANGEMENT D'ÉTAT
          ========================================= */

          onStateChange:
            function(event) {


              forceFullscreenSize();


              /* -------------------------------------
                 LA VIDÉO JOUE RÉELLEMENT
              ------------------------------------- */

              if (
                event.data ===
                YT.PlayerState.PLAYING
              ) {


                /*
                  Dernière sécurité :
                  on coupe encore les captions
                  au moment précis où la vidéo joue.
                */

                forceCaptionsOff(
                  event.target
                );


                /*
                  SEULEMENT MAINTENANT :

                  Woop TV peut retirer
                  l'écran noir + spinner.

                  Cela évite d'afficher
                  les miniatures / éléments YouTube
                  pendant l'initialisation.
                */

                notify(
                  "wooptv-trailer-playing"
                );

              }


              /* -------------------------------------
                 FIN DU TRAILER
              ------------------------------------- */

              if (
                event.data ===
                YT.PlayerState.ENDED
              ) {


                /*
                  Woop TV ferme le player
                  et revient automatiquement
                  sur la fiche du film.
                */

                notify(
                  "wooptv-trailer-ended"
                );

              }

            },


          /* =========================================
             ERREUR YOUTUBE
          ========================================= */

          onError:
            function() {


              document
                .getElementById(
                  "error"
                )
                .style.display =
                  "flex";


              notify(
                "wooptv-trailer-error"
              );

            }

        }

      }
    );


  /*
    Sécurité supplémentaire
    pour les anciennes versions
    du navigateur Tizen.
  */

  setTimeout(
    forceFullscreenSize,
    250
  );


  setTimeout(
    forceFullscreenSize,
    1000
  );


  setTimeout(
    forceFullscreenSize,
    2500
  );

}


/* =====================================================
   CHANGEMENT DE RÉSOLUTION / VIEWPORT
===================================================== */

window.addEventListener(
  "resize",
  forceFullscreenSize
);

</script>

</body>
</html>
